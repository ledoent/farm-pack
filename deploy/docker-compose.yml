name: farm-pack-review

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 20

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set in .env}
      DB_NAME: ${DB_NAME:-farm_demo}
      INIT_MODULES: ${INIT_MODULES:-farm_pack,farm_pack_demo}
      DEMO: ${DEMO:-1}
    volumes:
      # Mount the whole repo so iterating on the modules doesn't require
      # rebuilding the image. For a frozen review-env, set FREEZE=1 and the
      # entrypoint will skip the bind-mount path.
      - ..:/mnt/farm-pack:ro
      - filestore:/var/lib/odoo
    ports:
      - "${ODOO_PORT:-8069}:8069"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8069/web/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  pgdata:
  filestore:
